<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a2a;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #ff0050, #ff6b6b);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      flex: 0 0 auto;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    /* toggles hidden visually but still functional */
    .toggle-slider {
      position: absolute;
      width: 0; height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .toggle-slider::before { display: none; }

    .content {
      padding: 16px 20px 20px;
    }

    .status-bar {
      background: rgba(255, 0, 80, 0.1);
      border: 1px solid rgba(255, 0, 80, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #ff6b8a;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
    }
    .status-bar.off {
      background: rgba(140, 140, 140, 0.12);
      border-color: #333;
      color: #999;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00d26a;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
    }
    .status-dot.off {
      background: #666;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .section-icon {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      color: #ff6b6b;
    }



    .input-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
    }
    .input-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .input-field {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      color: #f1f1f1;
      font-size: 13px;
      outline: none;
      font-family: Consolas, Menlo, monospace;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #ff0050;
    }
    .input-field.invalid {
      border-color: #ff6b6b;
    }
    .input-field::placeholder {
      color: #555;
    }

    .preview-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .preview-title {
      font-size: 12px;
      color: #888;
    }
    .preview-note {
      font-size: 11px;
      color: #555;
      font-family: Consolas, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-note.error {
      color: #ff6b6b;
    }
    .preview-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }
    .preview-empty {
      padding: 10px;
      border: 1px dashed #2a2a2a;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .preview-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 8px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      font-size: 12px;
      color: #8a8a8a;
      transition: border-color 0.15s, color 0.15s;
    }
    .preview-item.hit {
      border-color: rgba(255, 0, 80, 0.5);
      color: #f1f1f1;
    }
    .preview-text {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }
    .preview-badge {
      flex: 0 0 auto;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a2a2a;
      color: #888;
      font-size: 10px;
    }
    .preview-item.hit .preview-badge {
      background: rgba(255, 0, 80, 0.18);
      color: #ff6b8a;
    }

    .footer {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-save {
      flex: 1;
      background: linear-gradient(135deg, #ff0050, #ff6b6b);
      border: none;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-save:hover {
      opacity: 0.9;
    }
    .btn-reset {
      width: 44px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-reset:hover {
      background: #333;
      color: #f1f1f1;
    }
    .btn-reset svg {
      width: 16px;
      height: 16px;
    }
    .btn-gen {
      width: 100%;
      margin-top: 8px;
      background: linear-gradient(135deg, #ff0050, #ff6b6b);
      border: none;
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-gen:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">抖</div>
      <span class="title">抖音净化器</span>
    </div>
    <label class="toggle" title="启用或禁用全部过滤">
      <input type="checkbox" id="master-toggle">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="content">
    <div class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">正在连接抖音页面</span>
    </div>

    <div class="section-header">
      <div class="section-title">
        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        弹幕过滤
      </div>
      <label class="toggle toggle-small" title="启用或禁用弹幕过滤">
        <input type="checkbox" id="danmu-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="input-box">
      <div class="input-label">正则表达式（匹配即隐藏）</div>
      <input type="text" class="input-field" id="danmu-regex" placeholder="广告|推广|抽奖|扫码" autocomplete="off" spellcheck="false">
      <button class="btn-gen" id="btn-gen-regex" type="button">生成正则</button>
      <div class="preview-box">
        <div class="preview-head">
          <span class="preview-title" id="preview-title">过滤效果预览</span>
          <span class="preview-note" id="preview-note">输入正则后展示将过滤的弹幕</span>
        </div>
        <div class="preview-list" id="preview-list"></div>
        <div class="preview-empty" id="preview-empty" hidden></div>
      </div>
    </div>

    <div class="footer">
      <button class="btn-save" id="btn-save" type="button">保存设置</button>
      <button class="btn-reset" id="btn-reset" type="button" title="重置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
